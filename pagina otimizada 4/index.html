    <!-- Circular JSON Protection & Network Error Handling for Analytics -->
    <script>
      (function() {
        // Meta Pixel fbq stub initialization to prevent 'fbq is not defined' errors
        if (!window.fbq) {
          var fbq = function() {
            fbq.callMethod ? fbq.callMethod.apply(fbq, arguments) : fbq.queue.push(arguments);
          };
          if (!window._fbq) window._fbq = fbq;
          fbq.push = fbq;
          fbq.loaded = true;
          fbq.version = '2.0';
          fbq.queue = [];
          window.fbq = fbq;
        }

        window.trackInitiateCheckout = function(value, currency) {
          try {
            if (typeof window.fbq === 'function') {
              window.fbq('track', 'InitiateCheckout', {
                value: value || 27.00,
                currency: currency || 'BRL'
              });
            }
          } catch (err) {
            console.warn('InitiateCheckout tracking warning:', err);
          }
        };

        // Prevent unhandled promise rejections from third-party tracking scripts
        window.addEventListener('unhandledrejection', function(event) {
          if (!event.reason) return;
          const msg = event.reason.message || String(event.reason);
          if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('fetch')) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || String(event.error);
          if (msg.includes('Failed to fetch') || msg.includes('Script error')) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);

        // Intercept window.fetch to catch third-party analytics failures gracefully
        if (typeof window.fetch === 'function') {
          const originalFetch = window.fetch;
          window.fetch = function() {
            const args = arguments;
            const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || '';
            return originalFetch.apply(this, args).catch(function(err) {
              if (url.includes('utmify') || url.includes('pixel') || url.includes('events') || url.includes('lead') || (err && err.message === 'Failed to fetch')) {
                console.warn('Tracking request handled safely:', url);
                return new Response(JSON.stringify({ status: 'ok' }), {
                  status: 200,
                  headers: { 'Content-Type': 'application/json' }
                });
              }
              return Promise.reject(err);
            });
          };
        }

        const originalStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          try {
            return originalStringify(value, replacer, space);
          } catch (err) {
            if (err instanceof TypeError && (err.message.includes("circular") || err.message.includes("Circular"))) {
              const seen = new WeakSet();
              return originalStringify(value, function(key, val) {
                if (typeof key === "string" && key.startsWith("__react")) {
                  return undefined;
                }
                if (typeof val === "object" && val !== null) {
                  if (seen.has(val)) {
                    return undefined;
                  }
                  seen.add(val);
                }
                if (typeof replacer === "function") {
                  return replacer.call(this, key, val);
                }
                return val;
              }, space);
            }
            throw err;
          }
        };
      })();
    </script>
